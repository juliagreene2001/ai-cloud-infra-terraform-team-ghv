name: Infrastructure checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-and-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.5
          python-version: "3.13"
      - name: Format and mocked policy checks
        run: |
          terraform -chdir=infra fmt -check -recursive
          uv run --python 3.13 --no-project python scripts/test_terraform.py
      - name: Namespace and execution guards
        run: uvx --python 3.13 --from pytest==9.2.0 pytest tests -q
